[package]
name = "catwalk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.catwalk]
path = ".."
features = ["archive"]

# Prevent the fuzz crate from being picked up by `cargo` invoked at the
# Catwalk/ workspace root. cargo-fuzz drives this crate explicitly.
[workspace]

[[bin]]
name = "fuzz_decrypt"
path = "fuzz_targets/fuzz_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_file_info"
path = "fuzz_targets/fuzz_parse_file_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_archive_extract"
path = "fuzz_targets/fuzz_archive_extract.rs"
test = false
doc = false
bench = false

[package]
name = "catwalk"
version = "0.1.0"
edition = "2021"
description = "CATWALK: CML-Sponge AEAD file encryption tool"
default-run = "catwalk"
authors = ["Andrew Unger"]
repository = "https://github.com/andrew-unger/chaotic_encryption"
readme = "../Support/README.md"

[lib]
name = "catwalk"
path = "src/lib.rs"

[[bin]]
name = "catwalk"
path = "src/main.rs"

[dependencies]
argon2 = "0.5.0"
thiserror = "1"
blake3 = "1.4.1"
clap = { version = "4", features = ["derive"] }
flate2 = "1.0.26"
zstd = "0.13"
rand = "0.8.6"
rpassword = "7.2.0"
subtle = "2.5.0"
zeroize = "1.6.0"

# GUI dependencies (optional)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate"], optional = true }

[features]
default = []
archive = ["zip"]
gui = ["archive", "eframe", "egui", "rfd"]

[[bench]]
name = "catwalk_bench"
path = "../Support/benches/catwalk_bench.rs"
harness = false

[[test]]
name = "cml_sponge_tests"
path = "../Support/tests/cml_sponge_tests.rs"

[[test]]
name = "round_trip"
path = "../Support/tests/round_trip.rs"

[[test]]
name = "keyfile_tests"
path = "../Support/tests/keyfile_tests.rs"

[[test]]
name = "utils_tests"
path = "../Support/tests/utils_tests.rs"

[[test]]
name = "archive_tests"
path = "../Support/tests/archive_tests.rs"
required-features = ["archive"]

[[test]]
name = "proptest_tests"
path = "../Support/tests/proptest_tests.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
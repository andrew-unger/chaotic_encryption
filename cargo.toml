[package]
name = "catwalk"
version = "0.1.0"
edition = "2021"
description = "CATWALK: CML-Sponge AEAD file encryption tool"

[lib]
name = "catwalk"
path = "src/lib.rs"

[[bin]]
name = "catwalk"
path = "src/main.rs"

[dependencies]
argon2 = "0.5.0"
blake3 = "1.4.1"
flate2 = "1.0.26"
rand = "0.8.5"
rpassword = "7.2.0"
subtle = "2.5.0"
zeroize = "1.6.0"

# GUI dependencies (optional)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate"], optional = true }

[features]
default = []
gui = ["eframe", "egui", "rfd", "zip"]

[[bench]]
name = "catwalk_bench"
path = "benches/catwalk_bench.rs"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true